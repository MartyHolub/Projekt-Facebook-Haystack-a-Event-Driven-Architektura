[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haystack-event-driven-cloud"
version = "0.1.0"
description = "Educational Haystack-inspired event-driven storage architecture"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "msgpack>=1.1.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0"
]

[tool.setuptools.packages.find]
include = ["cloud*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
